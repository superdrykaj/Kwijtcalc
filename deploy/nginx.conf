# Webserver voor de statische versie van KwijtCalc.
#
# De build zet elke pagina in een eigen map met een index.html. try_files zorgt
# dat /beroep en /beroep/ allebei op die index.html uitkomen, zodat een
# gedeelde link altijd werkt.

server {
    # Fly bereikt de container via een intern IPv4-adres, dus luisteren op
    # 0.0.0.0 volstaat. Een IPv6-regel laat de container crashen op omgevingen
    # zonder IPv6.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Achter de proxy van Fly kent nginx het publieke adres niet. Zonder deze
    # regel stuurt een omleiding de bezoeker naar poort 8080 van de container
    # in plaats van naar de website zelf.
    absolute_redirect off;

    # Bestandsnamen van de build bevatten een unieke code; die mogen lang
    # bewaard blijven. Pagina's zelf niet, anders zien gebruikers na een
    # verbetering nog de oude versie.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # De pdf-worker is een .mjs-bestand. Dat kent nginx niet, waardoor het als
    # download zou worden aangeboden en de browser weigert het uit te voeren.
    location ~ \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
